# Great Docs Configuration
# See https://posit-dev.github.io/great-docs/user-guide/03-configuration.html

module: pathmc
display_name: pathmc

# Explicit GitHub repo (auto-detection from pyproject.toml URLs works but is
# silent on failure; pinning it here makes source links and the changelog
# fail loudly if the repo ever moves).
repo: pymc-labs/pathmc
github_style:
  source: true

parser: numpy
dynamic: false  # cyclic alias detected; griffe AST analysis is sufficient

# Re-exports from upstream packages do not belong in our reference.
exclude:
  - Prior

# Landing page is generated from README.md. The user guide is a navbar tab,
# so its sidebar appears only inside that section, matching the Labs sites.
homepage: index

# Disable generated Markdown page downloads. The copy-page widget eagerly
# fetches the `.md` companion page on load, which makes navigation noticeably
# slower on long executable examples.
markdown_pages: false

# User Guide -----------------------------------------------------------------
# Source directory for the user guide. Files are auto-discovered and ordered
# by filename, so numeric prefixes determine the sidebar order.
user_guide: docs/user_guide

# Custom Sections ------------------------------------------------------------
sections:
  - title: Examples
    dir: docs/examples
    index: true
    # index_columns is clamped to 2 by great-docs. The listing still emits
    # auto-fill minmax(300px), but Quarto caps the article column at ~850px,
    # so that never reaches three cards. docs/assets/labs.css reclaims the
    # empty margin sidebar on this page so the grid can.
    index_columns: 2
    navbar_after: User Guide

# Page Tags ------------------------------------------------------------------
# Activates clickable tag pills under each page title and an auto-generated
# tag index page ("Tags" navbar link) that groups pages by tag. Per-page tags
# live in each example's `tags:` frontmatter and are the single source of truth
# for the example taxonomy. Note: tags drive navigation, not in-place filtering —
# clicking a pill jumps to that tag's section on the index page.
tags:
  enabled: true
  icons:
    Causal Inference: git-fork
    do-Operator: zap
    Identification: search
    Backdoor Criterion: shield
    Front-Door Criterion: door-open
    Collider Bias: alert-triangle
    G-Computation: calculator
    Treatment Effects: target
    Counterfactuals: split
    Mediation: route
    Moderation: sliders-horizontal
    Sensitivity Analysis: activity
    Refutation: shield-check
    Panel Data: table
    Difference-in-Differences: git-compare
    Simulation: dices
    Priors: sliders-horizontal
    Transforms: waves
    Basis Functions: grid-3x3
    Latent Variables: eye-off
    Media Mix Modeling: megaphone
    Hierarchical Effects: layers
    Categorical Predictors: list-tree
    Gaussian Process: waves
    HSGP: spline
    Nonparametric: trending-up
    Interpret: line-chart

# API Reference --------------------------------------------------------------
# Public surface only: top-level constructors, PathModel methods, result/display
# classes returned by those methods, and documented extension points.
# Internal helpers (parse/build/compile/compute functions) are excluded.
# title sets both the index heading and the navbar label. Labs calls that tab
# API, not Reference.
reference:
  title: API
  sections:
    - title: Modeling
      desc: Build, fit, and query Bayesian path models.
      contents:
        - modeling.model
        - modeling.PathModel
        - adjustment.AdjustmentModel
        - interpret.datagrid
    - title: Simulation
      desc: Time-forward and counterfactual simulation helpers.
      contents:
        - modeling.simulate
    - title: History-Dependent Treatment Policies
      desc: Rules evaluated inside a Gaussian lag-panel scan.
      contents:
        - policy.TreatmentPolicy
        - policy.TimeSchedule
        - policy.current
        - policy.previous
        - policy.where
        - policy_result.PolicyRun
        - policy_result.PolicySimulationInfo
    - title: DAG falsification
      desc: Whole-graph validation via a permutation-based test.
      contents:
        - falsify.falsify_graph
    - title: Causal discovery
      desc: Learn candidate structure from data and turn a DAG into a model.
      contents:
        - discovery.TBFPC
        - cpdag.same_markov_equivalence_class
        - dag.dag_to_spec
        - dag.BuildModelFromDAG
    - title: Custom transforms
      desc: Extend the model DSL with domain-specific transformations.
      contents:
        - transforms.Transform
        - transforms.ParamSpec
        - transforms.register_transform
    - title: Result objects
      desc: Result containers returned by PathModel and AdjustmentModel methods.
      contents:
        - simulate.DoResult
        - simulate.EstimandResult
        - interpret.InterpretResult
        - effects.EffectResult
        - identify.ImplicationTestResult
        - sensitivity.SensitivityResult
        - falsify.FalsificationResult
        - refute.PlaceboRefutationResult
        - discovery.TestResult

# Site appearance ------------------------------------------------------------
logo:
  light: docs/assets/logo_light.png
  dark: docs/assets/logo_dark.png
favicon: docs/assets/favicon.png
# mint is the mismatch with the Labs sites, and the preset injects an
# !important gradient after user CSS. Leave it unset. The sidebar-pin and
# footer-move halves of navbar-style.js (shipped only when a preset is set)
# are inlined below so scroll layout does not regress.
attribution: false
site:
  css: docs/assets/labs.css
dark_mode_toggle: true
# README already carries the logo and lead copy, so suppress the
# auto-generated hero block.
hero: false

# Graphviz figure sizing -----------------------------------------------------
# Quarto's {dot} engine defaults the SVG height to equal its width (a square)
# when only fig-width is set, letterboxing wide rankdir=LR DAGs with large
# vertical whitespace. The emitted SVG carries the true aspect ratio in its
# viewbox but also a fixed height attribute that CSS height:auto can't reliably
# override. This script reads the viewbox, drops the fixed height, and sets
# aspect-ratio so every DAG (current and future) sizes to its content. Scoped
# to graphviz via the <g class="graph"> marker so Mermaid/matplotlib SVGs are
# untouched.
include_in_header:
  - text: |
      <script>
      document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll("svg").forEach((svg) => {
          // Graphviz/{dot} SVGs carry a <g class="graph"> marker; this leaves
          // Mermaid and matplotlib SVGs untouched.
          if (!svg.querySelector("g.graph")) return;
          // Read the geometry via the SVGRect, not getAttribute("viewbox"):
          // the HTML parser renames the source "viewbox" to "viewBox", so a
          // lowercase getAttribute returns null.
          const vb = svg.viewBox && svg.viewBox.baseVal;
          if (!vb || !vb.width || !vb.height) return;
          svg.removeAttribute("height");
          svg.style.height = "auto";
          svg.style.maxHeight = "none";
          svg.style.aspectRatio = `${vb.width} / ${vb.height}`;
        });
      });
      </script>
      <style>
      /* great-docs sets figure.figure:has(.mermaid) { display: flex }, which
         lays the caption out beside the SVG and leaves the diagram at its
         intrinsic width. Stack the caption underneath a full-width diagram.
         Upstream: https://github.com/posit-dev/great-docs/issues/361 */
      .cell-output-display figure.figure:has(.mermaid-js),
      .cell-output-display figure.figure:has(.mermaid) {
        display: flex;
        flex-direction: column;
        align-items: stretch;
      }
      .cell-output-display figure.figure:has(.mermaid) > div,
      .cell-output-display figure.figure:has(.mermaid-js) > div {
        width: 100%;
      }
      svg.mermaid-js,
      .cell-output-display svg[id^="mermaid-"] {
        width: 100%;
        max-width: 100%;
        height: auto;
      }
      </style>
  - text: |
      <script>
      /* Non-gradient half of great-docs navbar-style.js. That file is the
         only place these two fixes live, and great-docs emits it only when
         navbar_style is set. Keep them so dropping the mint preset does not
         let headroom slide the sidebars under the sticky header, or unstick
         the sidebars when the footer starts. */
      (function () {
        "use strict";
        var mql = window.matchMedia("(min-width: 992px)");
        function fixSidebars() {
          if (!mql.matches) return;
          var header = document.querySelector("#quarto-header");
          if (!header) return;
          var h = header.offsetHeight;
          var els = document.querySelectorAll(".sidebar, .headroom-target");
          els.forEach(function (el) {
            if (el.classList.contains("gd-sidebar-float")) return;
            el.style.top = h + "px";
            el.style.maxHeight = "calc(100vh - " + h + "px)";
          });
        }
        window.addEventListener("quarto-hrChanged", fixSidebars);
        mql.addEventListener("change", fixSidebars);
      })();
      (function () {
        "use strict";
        var mql = window.matchMedia("(min-width: 992px)");
        var moved = false;
        var originalParent = null;
        var originalNext = null;
        function update() {
          var content = document.getElementById("quarto-content");
          var footer = document.querySelector("footer.footer");
          if (!content || !footer) return;
          if (mql.matches && !moved) {
            originalParent = footer.parentNode;
            originalNext = footer.nextSibling;
            footer.style.gridColumn = "1 / -1";
            content.appendChild(footer);
            moved = true;
          } else if (!mql.matches && moved) {
            footer.style.gridColumn = "";
            if (originalNext) {
              originalParent.insertBefore(footer, originalNext);
            } else {
              originalParent.appendChild(footer);
            }
            moved = false;
          }
        }
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", update);
        } else {
          update();
        }
        mql.addEventListener("change", update);
      })();
      </script>
  - text: |
      <script>
      /* great-docs has no page-footer key, and it writes a centered
         "Developed by" line whenever that key is absent. Labs sites use a
         copyright line and the shared icon links instead. */
      document.addEventListener("DOMContentLoaded", () => {
        const slot = document.querySelector("footer.footer .nav-footer");
        if (!slot || slot.querySelector(".labs-footer-links")) return;
        // Font Awesome 6.4.0, the sheet great-docs loads, has no
        // fa-x-twitter glyph. An empty <i> leaves the "X" label on the
        // text baseline, below the other icons. Inline the mark instead.
        const xIcon =
          '<svg class="labs-x-icon" viewBox="0 0 24 24" aria-hidden="true">' +
          '<path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.727-8.835L1.254 2.25H8.08l4.253 5.622L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>' +
          "</svg>";
        const links = [
          ["https://x.com/pymc_labs", xIcon, "X"],
          ["https://github.com/pymc-labs/pathmc", "fa-brands fa-github", "Github"],
          ["https://www.linkedin.com/company/pymc-labs/", "fa-brands fa-linkedin", "LinkedIn"],
          ["https://www.youtube.com/c/PyMCLabs", "fa-brands fa-youtube", "YouTube"],
          ["https://www.meetup.com/pymc-labs-online-meetup/", "fa-brands fa-meetup", "Meetup"],
          ["https://www.pymc-labs.com/contact", "fa-solid fa-file-signature", "Contact"],
        ];
        const items = links.map(([href, icon, label]) => {
          const mark = icon.startsWith("<")
            ? icon
            : `<i class="${icon}" aria-hidden="true"></i>`;
          return `<li><a href="${href}">${mark}<span>${label}</span></a></li>`;
        }).join("");
        slot.innerHTML =
          '<p class="labs-footer-copy">© Copyright 2025–2026, PyMC Labs.</p>' +
          `<ul class="labs-footer-links">${items}</ul>`;
      });
      </script>


# SEO ------------------------------------------------------------------------
# Public docs URL at pathmc.pymc-labs.com (matches pyproject.toml [project.urls] Documentation).
# Required for sitemap.xml, canonical links, and social-card absolute URLs.
seo:
  canonical:
    base_url: https://pathmc.pymc-labs.com/

# Project-level bibliography is forwarded to all rendered pages.
bibliography: docs/references.bib

# Jupyter kernel for executable code cells. Registered via `make jupyter-kernel`.
jupyter: pathmc

# Render code-cell figures as 2x PNGs and display them at their logical size.
fig-format: retina

# Freeze cache --------------------------------------------------------------
# Local builds execute and cache; remote builds only render from the committed
# `_freeze/` cache. Refresh after editing a page with `great-docs freeze <page>`.
# `true` (not `auto`) ensures CI never re-executes a page even if its source
# hash drifted: pathmc's MCMC outputs are non-deterministic and pages should
# only be re-executed deliberately via `great-docs freeze`.
freeze: true

# Curated agent SKILL.md (see Phase 3 of the migration plan). Lives inside the
# package directory so it ships in the wheel and `great-docs skill install
# pathmc` resolves it for pip-installed users (issue #209).
skill:
  enabled: true
  file: pathmc/skills/pathmc/SKILL.md
