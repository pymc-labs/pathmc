# One-shot. Records GitHub timings for the first .test_durations commit.
# Delete this workflow in the commit that adds that file.
name: record test durations once

on:
  push:
    branches: [feat/249-pytest-split]

permissions: {}

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install dependencies
        run: uv sync --all-extras --locked
      - name: Record timings from a full run
        run: make record-test-durations
      - name: Upload timings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-durations
          path: |
            fresh.test_durations
            fresh-junit.xml
          if-no-files-found: error
