name: refresh test durations

on:
  workflow_dispatch:
  schedule:
    # Sunday and Wednesday 06:00 UTC. Twice weekly: the repo's cache
    # retention is 7 days, so a single failed run must not strand the
    # compile-cache pool until the next week. This job is also the sole
    # PyTensor compile-cache publisher: it runs the full suite, so its
    # snapshot is a superset of every test-shard group.
    - cron: "0 6 * * 0"
    - cron: "0 6 * * 3"

permissions: {}

concurrency:
  group: refresh-test-durations
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      # gh cache delete in the snapshot refresh step
      actions: write
    strategy:
      # Mirror the test-shard matrix so both interpreters' compile pools
      # get a published snapshot. The version key embeds the Python
      # version, so each leg saves its own canonical snapshot key.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      # Portable-target pins, matching ci.yml's test-shard job so the
      # published snapshot's cache keys match what shards restore.
      PYTENSOR_FLAGS: >-
        cxxflags=-march=x86-64,compiledir_format=compiledir-%(python_version)s-%(python_bitwidth)s
      NUMBA_CPU_NAME: generic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scheduled runs time main; a manual dispatch (the cache-seeding
          # path) runs the dispatched ref so the branch's action is present.
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref }}
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install dependencies
        run: uv sync --all-extras --locked
      - name: PyTensor compile cache
        uses: ./.github/actions/pytensor-cache
      - name: Record timings from a full run
        run: make record-test-durations
      - name: Delete previous PyTensor cache snapshot
        # actions/cache never overwrites, so the sole updater deletes the
        # canonical snapshot key first, then re-saves it below.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KEY=$(cat /tmp/pytensor-snapshot-key)
          echo "refreshing snapshot key: $KEY"
          gh cache list --key "$KEY" --json id --jq '.[].id' | xargs -r gh cache delete
      - name: Save PyTensor cache snapshot
        env:
          KEY_FILE: /tmp/pytensor-snapshot-key
        id: snapshot
        run: echo "key=$(cat "$KEY_FILE")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pytensor
          key: ${{ steps.snapshot.outputs.key }}
      - name: Decide whether the split moved
        # Only the 3.12 leg opens the timing pull request; the 3.14 leg
        # exists to publish its compile-cache snapshot.
        if: matrix.python-version == '3.12'
        id: drift
        run: |
          set +e
          # --splits must equal the test-shard `group:` length in ci.yml, not strategy.job-total.
          uv run --locked --all-extras python scripts/duration_drift.py \
            --old .test_durations \
            --new fresh.test_durations \
            --junit fresh-junit.xml \
            --splits 4 \
            --threshold 120 \
            > drift-summary.txt
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat drift-summary.txt
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then
            exit "$code"
          fi
      - name: Open or update the timing pull request
        if: matrix.python-version == '3.12' && steps.drift.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/refresh-test-durations
          cp fresh.test_durations .test_durations
          # pytest-split writes JSON without the final newline required by prek.
          uv run --locked --all-extras python - <<'PY'
          from pathlib import Path

          path = Path(".test_durations")
          path.write_text(path.read_text().rstrip("\n") + "\n")
          PY
          uv run --locked --all-extras prek run --files .test_durations
          git add .test_durations
          if git diff --cached --quiet; then
            echo "Timings are unchanged. No pull request."
            exit 0
          fi
          git commit -m "Refresh pytest-split timings"
          gh auth setup-git
          # checkout fetches only main, so a plain fetch does not create
          # origin/chore/refresh-test-durations. Name the destination ref.
          remote_ref=refs/heads/chore/refresh-test-durations
          tracking_ref=refs/remotes/origin/chore/refresh-test-durations
          if git fetch origin "${remote_ref}:${tracking_ref}"; then
            expected=$(git rev-parse "$tracking_ref")
            git push --force-with-lease="${remote_ref}:${expected}" origin HEAD:chore/refresh-test-durations
          else
            git push origin HEAD:chore/refresh-test-durations
          fi
          existing=$(gh pr list --head chore/refresh-test-durations --base main --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file drift-summary.txt
          else
            gh pr create \
              --base main \
              --head chore/refresh-test-durations \
              --title "Refresh pytest-split timings" \
              --body-file drift-summary.txt
          fi
