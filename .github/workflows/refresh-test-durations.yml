name: refresh test durations

on:
  workflow_dispatch:
  schedule:
    # Sunday 06:00 UTC. The nightly Tier 5 job is 03:00 UTC every day and
    # runs a different selection. This job times the per-commit suite.
    - cron: "0 6 * * 0"

permissions: {}

concurrency:
  group: refresh-test-durations
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install dependencies
        run: uv sync --all-extras --locked
      - name: Record timings from a full run
        run: make record-test-durations
      - name: Decide whether the split moved
        id: drift
        run: |
          set +e
          # --splits must equal the test-shard matrix length in ci.yml.
          uv run --locked --all-extras python scripts/duration_drift.py \
            --old .test_durations \
            --new fresh.test_durations \
            --junit fresh-junit.xml \
            --splits 4 \
            --threshold 120 \
            > drift-summary.txt
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat drift-summary.txt
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then
            exit "$code"
          fi
      - name: Open or update the timing pull request
        if: steps.drift.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/refresh-test-durations
          cp fresh.test_durations .test_durations
          # pytest-split writes JSON without the final newline required by prek.
          uv run --locked --all-extras python - <<'PY'
          from pathlib import Path

          path = Path(".test_durations")
          path.write_text(path.read_text().rstrip("\n") + "\n")
          PY
          uv run --locked --all-extras prek run --files .test_durations
          git add .test_durations
          if git diff --cached --quiet; then
            echo "Timings are unchanged. No pull request."
            exit 0
          fi
          git commit -m "Refresh pytest-split timings"
          gh auth setup-git
          # checkout fetches only main, so a plain fetch does not create
          # origin/chore/refresh-test-durations. Name the destination ref.
          remote_ref=refs/heads/chore/refresh-test-durations
          tracking_ref=refs/remotes/origin/chore/refresh-test-durations
          if git fetch origin "${remote_ref}:${tracking_ref}"; then
            expected=$(git rev-parse "$tracking_ref")
            git push --force-with-lease="${remote_ref}:${expected}" origin HEAD:chore/refresh-test-durations
          else
            git push origin HEAD:chore/refresh-test-durations
          fi
          existing=$(gh pr list --head chore/refresh-test-durations --base main --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file drift-summary.txt
          else
            gh pr create \
              --base main \
              --head chore/refresh-test-durations \
              --title "Refresh pytest-split timings" \
              --body-file drift-summary.txt
          fi
