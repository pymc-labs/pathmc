name: nightly

on:
  workflow_dispatch:
  schedule:
    # Tier 5 MCMC recovery, light SBC, and the larger Hypothesis fuzz budget.
    # Not on the per-commit path: `make test` already runs `@pytest.mark.slow`
    # and the small fuzz budget.
    - cron: "0 3 * * *"

permissions: {}

jobs:
  tier5:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install dependencies
        run: uv sync --all-extras --locked
      - name: Run nightly Tier 5 and fuzz budget
        run: make test-nightly
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
