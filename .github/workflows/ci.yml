name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Detect non-documentation changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - 'pathmc/**'
              - '**'
              - '!docs/**'
              - '!examples/**'
              - '!great-docs/**'
              - '!_freeze/**'
              - '!great-docs.yml'
              - '!*.md'
              - '!*.qmd'
              - '!**/*.qmd'

  # Four groups share the per-commit selection on each CI Python. pytest-split
  # balances them from .test_durations. SPLITS is that group count, not
  # strategy.job-total: the Python axis doubles the jobs without changing the
  # split. The weekly job reads `group:` and passes that count to
  # duration_drift.py. Oldest (3.12) and newest (3.14) each run the full
  # split. Samplers wheels resolve on 3.14, so both legs use --all-extras.
  # Coverage stays the 3.12 combine; a 3.14 failure still fails `test`.
  # .python-version stays 3.12. UV_PYTHON keeps `make`'s `uv run` on this leg.
  # The required check stays named `test`.
  test-shard:
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' ||
       needs.changes.result != 'success' ||
       needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-extras --locked --python ${{ matrix.python-version }}
      - name: Run tests
        env:
          COVERAGE_FILE: coverage-data/.coverage.shard-${{ matrix.group }}
          GROUP: ${{ matrix.group }}
          SPLITS: "4"
        run: |
          mkdir -p coverage-data
          make test-shard GROUP="$GROUP" SPLITS="$SPLITS"
      - name: Upload coverage data
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.group }}
          path: coverage-data/
          include-hidden-files: true
          if-no-files-found: error

  test:
    needs: [changes, test-shard]
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' ||
       needs.changes.result != 'success' ||
       needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Require shard success
        if: needs.test-shard.result != 'success'
        env:
          SHARD_RESULT: ${{ needs.test-shard.result }}
        run: |
          echo "test shards result: ${SHARD_RESULT}"
          echo "A shard failed or was cancelled. Fix that job; do not lower the coverage threshold to hide it."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install dependencies
        run: uv sync --all-extras --locked
      - name: Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage-data
          merge-multiple: true
      - name: Enforce combined coverage
        run: |
          find coverage-data -type f -print
          uv run --locked --all-extras coverage combine coverage-data
          uv run --locked --all-extras coverage report

  prek:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install dependencies
        run: uv sync --all-extras --locked
      - name: Run lint
        run: make lint
