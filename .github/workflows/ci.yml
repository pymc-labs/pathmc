name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Detect non-documentation changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - 'pathmc/**'
              - '**'
              - '!docs/**'
              - '!examples/**'
              - '!great-docs/**'
              - '!_freeze/**'
              - '!great-docs.yml'
              - '!*.md'
              - '!*.qmd'
              - '!**/*.qmd'

  # Four groups share the per-commit selection on each CI Python. pytest-split
  # balances them from .test_durations. SPLITS is that group count, not
  # strategy.job-total: the Python axis doubles the jobs without changing the
  # split. refresh-test-durations.yml hardcodes --splits 4; the duration-drift
  # test checks that count against this `group:` list. Oldest (3.12) and
  # newest (3.14) each run the full split. Samplers wheels resolve on 3.14,
  # so both legs use --all-extras. Coverage stays the 3.12 combine; a 3.14
  # failure still fails `test`. .python-version stays 3.12. UV_PYTHON keeps
  # `make`'s `uv run` on this leg. The required check stays named `test`.
  test-shard:
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' ||
       needs.changes.result != 'success' ||
       needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      # Pin both compile caches to a portable target so cache keys do not
      # embed the runner's CPU. GitHub's runner fleet is heterogeneous: with
      # native CPU targeting, numba's cache key includes the host CPU name
      # and pytensor's C key includes auto-detected march flags, so warm
      # restores only hit on runners of the same CPU generation.
      # gcc__cxxflags, not cxxflags: pytensor 3.3.6 rejects the latter
      # ("does not recognise this flag") and would leave CPU
      # autodetection in effect, re-introducing the runner-CPU lottery.
      PYTENSOR_FLAGS: >-
        gcc__cxxflags=-march=x86-64,compiledir_format=compiledir-%(python_version)s-%(python_bitwidth)s
      NUMBA_CPU_NAME: generic
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-extras --locked --python ${{ matrix.python-version }}
      - name: PyTensor compile cache
        id: cache
        uses: ./.github/actions/pytensor-cache
      - name: Run tests
        env:
          COVERAGE_FILE: coverage-data/.coverage.shard-${{ matrix.group }}
          GROUP: ${{ matrix.group }}
          SPLITS: "4"
        run: |
          mkdir -p coverage-data /tmp/pytensor-cache-stats
          start=$(date +%s)
          make test-shard GROUP="$GROUP" SPLITS="$SPLITS"
          rc=$?
          echo $(( $(date +%s) - start )) > /tmp/pytensor-cache-stats/shard_seconds
          exit $rc
      - name: Collect PyTensor cache counts
        if: always()
        run: |
          mkdir -p /tmp/pytensor-cache-stats
          (find ~/.pytensor -name '*.so' 2>/dev/null || true) | wc -l > /tmp/pytensor-cache-stats/after_so
          (find ~/.pytensor -name '*.nbc' 2>/dev/null || true) | wc -l > /tmp/pytensor-cache-stats/after_nbc
      - name: Report PyTensor cache hit rate
        if: always()
        env:
          MATCHED_KEY: ${{ steps.cache.outputs.cache-matched-key }}
        run: |
          mkdir -p /tmp/pytensor-cache-stats
          rso=$(cat /tmp/pytensor-cache-stats/restore_so 2>/dev/null || echo 0)
          rnbc=$(cat /tmp/pytensor-cache-stats/restore_nbc 2>/dev/null || echo 0)
          aso=$(cat /tmp/pytensor-cache-stats/after_so 2>/dev/null || echo 0)
          anbc=$(cat /tmp/pytensor-cache-stats/after_nbc 2>/dev/null || echo 0)
          secs=$(cat /tmp/pytensor-cache-stats/shard_seconds 2>/dev/null || echo 0)
          c_so=$((aso - rso)); c_nbc=$((anbc - rnbc))
          pct_so=$(awk -v c="$c_so" -v t="$aso" 'BEGIN { printf "%.0f", (t > 0) ? 100 - 100 * c / t : 100 }')
          pct_nbc=$(awk -v c="$c_nbc" -v t="$anbc" 'BEGIN { printf "%.0f", (t > 0) ? 100 - 100 * c / t : 100 }')
          mins=$((secs / 60))
          {
            echo "### PyTensor cache (py${{ matrix.python-version }} group${{ matrix.group }})"
            echo ""
            echo "+ restore matched key: ${MATCHED_KEY:-none}"
            echo "+ C modules: ${rso} restored, ${c_so} compiled (${pct_so}% warm)"
            echo "+ numba files: ${rnbc} restored, ${c_nbc} compiled (${pct_nbc}% warm)"
            echo "+ shard duration: ${mins} min"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage data
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.group }}
          path: coverage-data/
          include-hidden-files: true
          if-no-files-found: error

  test:
    needs: [changes, test-shard]
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' ||
       needs.changes.result != 'success' ||
       needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Require shard success
        if: needs.test-shard.result != 'success'
        env:
          SHARD_RESULT: ${{ needs.test-shard.result }}
        run: |
          echo "test shards result: ${SHARD_RESULT}"
          echo "A shard failed or was cancelled. Fix that job; do not lower the coverage threshold to hide it."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install dependencies
        run: uv sync --all-extras --locked
      - name: Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage-data
          merge-multiple: true
      - name: Enforce combined coverage
        run: |
          find coverage-data -type f -print
          uv run --locked --all-extras coverage combine coverage-data
          uv run --locked --all-extras coverage report

  prek:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install dependencies
        run: uv sync --all-extras --locked
      - name: Run lint
        run: make lint
