name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Detect non-documentation changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - 'pathmc/**'
              - '**'
              - '!docs/**'
              - '!examples/**'
              - '!great-docs/**'
              - '!_freeze/**'
              - '!great-docs.yml'
              - '!*.md'
              - '!*.qmd'
              - '!**/*.qmd'

  # Four computers share the per-commit selection. pytest-split balances them
  # from .test_durations. The matrix length is the split count the weekly job
  # passes to duration_drift.py. The required check stays named `test`.
  test-shard:
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' ||
       needs.changes.result != 'success' ||
       needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install dependencies
        run: uv sync --all-extras --locked
      - name: Run tests
        env:
          COVERAGE_FILE: coverage-data/.coverage.shard-${{ matrix.group }}
          GROUP: ${{ matrix.group }}
          SPLITS: ${{ strategy.job-total }}
        run: |
          mkdir -p coverage-data
          make test-shard GROUP="$GROUP" SPLITS="$SPLITS"
      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.group }}
          path: coverage-data/
          include-hidden-files: true
          if-no-files-found: error

  test:
    needs: [changes, test-shard]
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' ||
       needs.changes.result != 'success' ||
       needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Require shard success
        if: needs.test-shard.result != 'success'
        env:
          SHARD_RESULT: ${{ needs.test-shard.result }}
        run: |
          echo "test shards result: ${SHARD_RESULT}"
          echo "A shard failed or was cancelled. Fix that job; do not lower the coverage threshold to hide it."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install dependencies
        run: uv sync --all-extras --locked
      - name: Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage-data
          merge-multiple: true
      - name: Enforce combined coverage
        run: |
          find coverage-data -type f -print
          uv run --locked --all-extras coverage combine coverage-data
          uv run --locked --all-extras coverage report

  prek:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install dependencies
        run: uv sync --all-extras --locked
      - name: Run lint
        run: make lint
